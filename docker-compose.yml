services:
  backend:
    build: ./backend
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      - backend_data:/app/data
    ports:
      - "8009:8000"
    restart: unless-stopped

  # react-bot.bssm.dev 공인 도메인을 라즈베리파이의 backend(8000)로 연결하는 터널.
  # 포트포워딩 없이도 Discord OAuth 콜백/봇 인증 코드 흐름이 동작하려면 필요하다.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
